name: Calisxtreme - Publicar Atualizacao

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar ferramentas de validacao Android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOL_DIR=""
          for candidate in "$SDK_ROOT"/build-tools/*; do
            if [[ -x "$candidate/aapt" && -x "$candidate/apksigner" ]]; then
              TOOL_DIR="$candidate"
            fi
          done
          if [[ -z "$TOOL_DIR" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [[ -z "$SDKMANAGER" ]]; then
              echo "sdkmanager nao encontrado no runner" >&2
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'build-tools;35.0.0' || true
            TOOL_DIR="$SDK_ROOT/build-tools/35.0.0"
          fi
          test -x "$TOOL_DIR/aapt"
          test -x "$TOOL_DIR/apksigner"
          echo "$TOOL_DIR" >> "$GITHUB_PATH"
          echo "Ferramentas Android encontradas: $TOOL_DIR"
      - name: Verificar release e atualizar update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/atualizar_manifesto.py
      - name: Publicar manifesto
        run: |
          if git diff --quiet -- update.json; then
            echo 'Nao ha atualizacao.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'Calisxtreme: atualizar versao publicada'
          git push origin HEAD:main
